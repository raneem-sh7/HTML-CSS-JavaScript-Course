<!DOCTYPE html>

<html>
<head>

    <title>Responsive Web Page</title>

    <meta name="viewport" content="width=device-width initial-scale=1.0" > 
</head>
<body>

    <h1>My Responsive Page</h1>

    <p>This page can adapt to different screen sizes.</p>

</body>

</html>
