<!DOCTYPE html>
<html>
    <head>
        <title>CSS Classes & IDs</title>

        <!-- Define classes and IDs using the <style> tag -->
            
        <!-- Classes are selected using a dot (.) -->
        <!-- IDs are selected using a hash (#) -->
        <style> 
            
            .red{
                color:red;
            }
            .bold{
                font-weight:bold;
            }
            .green{
                color:green;
            }
            
            #black{
                color:black;
            }
            

        </style>
    </head>
    <body>
        <!-- Multiple classes can be applied to the same element -->
        <p class="red bold">Class 1</p> 

        <!-- An element can have both an ID and a class -->
        <!-- IDs should be unique within a page -->
        <!-- ID selectors have higher specificity than class selectors -->
        <p id="black" class="green">Class 2</p>


    </body>
</html>
