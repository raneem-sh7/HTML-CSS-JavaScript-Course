<!DOCTYPE html>
<html>
    <head>
       <title>iFrame & quotations</title>
    </head>
    <body>
        <h1>iFrame Example</h1>
        <p>This is an example of an iFrame that embeds another webpage within this page</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6766.549307856089!2d35.87833900790406!3d32.00767309734335!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151c9f4c5e5d84dd%3A0x5eac45a67771062!2z2KjZiNin2KjYqSDYp9mE2LfYqCAtINin2YTYrNin2YXYudipINin2YTYo9ix2K_ZhtmK2Kk!5e0!3m2!1sar!2sjo!4v1790886472060!5m2!1sar!2sjo" 
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
        
        <h2>Quotations</h2>
        <p>Here are some examples of quotations:</p>
        <blockquote>
            "This is a sample quotation "
        </blockquote>
        <p>Another way to include quotations is by using the <q> tag for inline quotes.</p>
        <p><q>This is an inline quotation.</q></p>
    </body>
</html>
