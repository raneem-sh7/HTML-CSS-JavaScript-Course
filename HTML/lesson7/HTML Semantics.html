<!DOCTYPE html>

<html>

<head>

    <title>Lesson 7-Semantics</title>

</head>

<body>

    <!-- Non-semantic HTML elements -->
    <!-- <div> is used to group HTML elements into a container -->

    <div>Header</div>
    <div>Navigation</div>
    <div>Content</div>
    <div>Footer</div>


    <!-- Semantic HTML elements -->
    <!-- Semantic tags clearly describe the meaning and purpose of their content -->

    <header>
        <h1>Header</h1>
    </header>

    <nav>
        <a href="link">Home</a>
        <a href="link">About</a>
    </nav>

    <main>
        <h2>Main Content</h2>
    </main>

    <section>
        <h2>Section</h2>
    </section>

    <article>
        <h2>Article</h2>
        <p>This is an article.</p>
    </article>

    <aside>
        <h2>Aside</h2>
        <p>This is additional content.</p>
    </aside>

    <footer>
        <p>Footer</p>
    </footer>

</body>
</html>
