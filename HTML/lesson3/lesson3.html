<!DOCTYPE html>
<html>
    <head>
        <title>Inline Styles</title>
    </head>
    <body>
        <h1><b>1- Select a Colors name</b></h1><!--can be used to specify colors by name-->
        <h3 style="color:red">Red</h3>
        <h3 style="color:green">Green</h3>
        <h3 style="color:blue">Blue</h3>

        <h1><b>2- Code Colors</b></h1><!--used code on hexadecimal and rgb to specify colors-->

        <h2>#HEX :Hexadecimal</h2> <!--can be used to specify colors in hexadecimal format from 0 to F-->
        <h3 style="color:#FF0000">Red</h3>  
        <h3 style="color:#00FF00">Green</h3>
        <h3 style="color:#0000FF">Blue</h3>


        <h2>#RGB : Red Green Blue</h2><!--can be used to specify colors in rgb format from 0 to 255-->
        <h3 style="color:rgb(255,0,0)">Red</h3>
        <h3 style="color:rgb(0,255,0)">Green</h3>
        <h3 style="color:rgb(0,0,255)">Blue</h3>

    </body>
</html>
