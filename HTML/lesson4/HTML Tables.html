<!DOCTYPE html>
<html>
    <head>
        <title>Tables</title>
    </head>
    <body>  
        <table border="1"><!--used to create a table-->
            <tr>
                <th>Header1</th><!--used to create a table header-->
                <th>Header2</th>
                <th>Header3</th>
                <th>Header4</th>    
            </tr>
            <tr><!--used to create a table row-->
                <td>cell 1</td><!--used to create a table cell-->
                <td>cell 2</td>
                <td>cell 3</td>
                <td>cell 4</td>
            </tr>
            <tr><!--row 2-->
                <td>cell 5</td>
                <td>cell 6</td>
                <td>cell 7</td>
                <td>cell 8</td>
            </tr>
            <tr><!--row 3-->
                <td>cell 9</td>
                <td>cell 10</td>
                <td colspan="2">cell 11</td> <!--used to merge two cells into one cell-->
                
            </tr>
        </table>
    </body>
</html>
