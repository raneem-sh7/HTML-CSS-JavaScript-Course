<!DOCTYPE html>
<html>
    <head>
        <title>Links</title>
    </head>

    <body>

    <!-- URL links -->
    
    <!-- Opens in the same tab -->
    <a href="https://www.google.com">Google</a>
    
    <!-- Opens in a new tab -->
    <a href="https://www.google.com" target="_blank">Google</a>
    
    <!-- Image as a clickable link -->
    <a href="https://www.google.com" target="_blank">
        <img src="Googleimage.jpg" alt="Google">
    </a>
    
    
    <!-- URI schemes -->
    
    <!-- Opens the email client -->
    <a href="mailto:test@google.com">Send email</a>
    
    <!-- Opens the phone dialer -->
    <a href="tel:1234567890">Call</a>
    
    <!-- Opens the messaging app -->
    <a href="sms:1234567890">Text</a>

    </body>
</html>
