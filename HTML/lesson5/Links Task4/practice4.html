<!DOCTYPE html>
<html>
    <head>
        <title>My links</title>
    </head>
    <body>
        <h1>Useful Websites</h1>
        <!--Unordered list of links -->
        <ul> 
            <li><a href="https://www.google.com">Google</a></li>
            <li><a href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>
            <li><a href="https://www.github.com" target="_blank">GitHub</a></li>
        </ul>
        
        <!--Image link-->
        <h1>Let Solve Problems</h1>
        <ul><li><p>Click the image to visit the Codeforces website.</p></li></ul>
        <a href="https://codeforces.com" target="_blank">
            <img src="problemsolve.jpg" alt="Codeforces website">   
        </a>
        <!--the alt attribute provides alternative information for an image if a user for some reason cannot view it-->
        
        <!--URI links-->
        <h1>Contact Information</h1>
        <ul>
            <li><a href="mailto:test@example.com">Send me an email</a></li>
            <li><a href="tel:1234567890">Call me</a></li>
            <li><a href="sms:1234567890">Send me a text message</a></li>
        </ul>
    </body>
</html>
